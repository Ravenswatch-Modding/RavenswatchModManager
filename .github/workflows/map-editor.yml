name: Map editor

# Test builds of the native map editor (apps/map-editor): the editor binary
# with the frozen rsmm CLI beside it (the editor finds `rsmm[.exe]` in its own
# folder), zipped per OS as a workflow artifact. Not a release.
on:
  push:
    branches: [feat/native-map-editor]
    paths:
      - 'apps/map-editor/**'
      - 'src/rsmm/**'
      - 'scripts/build-sidecar.py'
      - '.github/workflows/map-editor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/map-editor/**'
      - '.github/workflows/map-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: map editor ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Linux window / input headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev

      - name: Rust tests
        working-directory: apps/map-editor
        run: cargo test --release --locked

      - name: Build the editor
        working-directory: apps/map-editor
        run: cargo build --release --locked

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the rsmm CLI it runs
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -e .
          python scripts/build-sidecar.py

      - name: Package
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p pkg
          cp "apps/map-editor/target/release/rsmm-map-editor$ext" pkg/
          cp apps/desktop/src-tauri/binaries/rsmm-*"$ext" "pkg/rsmm$ext"
          [ -z "$ext" ] && chmod +x pkg/*
          {
            echo "RSMM map editor test build (${GITHUB_SHA::8})"
            echo
            echo "Run rsmm-map-editor$ext. rsmm$ext beside it is the CLI it reads game data through."
            echo "Ravenswatch must be installed (or set RSMM_GAME_DIR). Guide: https://docs.rsmm.me/guides/map-editor/"
          } > pkg/README.txt

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: rsmm-map-editor-${{ runner.os }}
          path: pkg/
          if-no-files-found: error
